# .github/workflows/deploy.yml
#
# Deploys your php-ssg site to GitHub Pages on every push to main.
# Copy this file into your project's .github/workflows/ directory and
# enable GitHub Pages in your repo settings (Source: GitHub Actions).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Install php-ssg
        run: composer global require dimasd-angga/php-ssg

      - name: Build site
        run: $(composer global config bin-dir --absolute)/php-ssg build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
